name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "Windows11/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Windows11/PixelColorClicker.csproj

      - name: Publish single-file EXE
        run: >-
          dotnet publish Windows11/PixelColorClicker.csproj
          -c Release
          -r win-x64
          --self-contained false
          --no-restore
          -o Windows11/publish

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "Windows11/publish/PixelColorClicker.exe"
          if (-not (Test-Path $exe)) { throw "PixelColorClicker.exe was not generated" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Verify release folder
        shell: pwsh
        run: |
          $settings = "Windows11/publish/settings.json"
          if (-not (Test-Path $settings)) { throw "settings.json was not generated" }
          Get-ChildItem "Windows11/publish" | Format-Table Name, Length

      - name: Upload release folder
        uses: actions/upload-artifact@v7
        with:
          name: PixelColorClicker-Windows11-x64
          path: |
            Windows11/publish/PixelColorClicker.exe
            Windows11/publish/settings.json
